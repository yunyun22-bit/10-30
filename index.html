el for="taskRepeat">重複</label><select id="taskRepeat"><option value="none">不重複</option><option value="daily">每天</option><option value="weekly">每週</option><option value="monthly">每月</option></select></div></div><label style="display:flex;align-items:center;gap:8px;font-size:12px;margin:12px 0"><input type="checkbox" id="taskHasTime"> 設定執行時間</label></div><div class="field" id="typeField"><label for="entryType">類型</label><select id="entryType"><option value="task">待辦任務</option><option value="event">行程</option></select></div><button class="submit" type="submit">儲存</button></form></div></div><div class="toast" id="toast"></div>

const today=new Date();today.setHours(0,0,0,0);const iso=d=>{const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)};const quotes=['今天的每一步，都在靠近更好的自己。','慢慢來也沒關係，只要沒有停下來。','把大目標拆成小步驟，今天先完成一步。','你不必一次做到完美，只要開始就很好。','專注當下，成果會在日常裡慢慢累積。','給自己一點耐心，成長正在發生。','今天的努力，是明天的底氣。','相信自己的節奏，每一天都算數。','先完成，再慢慢變好。','每一個小小的進步，都值得肯定。'];let quoteSeed=0;for(const ch of iso(today))quoteSeed=(quoteSeed*31+ch.charCodeAt(0))>>>0;document.getElementById('dailyQuote').textContent='「'+quotes[quoteSeed%quotes.length]+'」';const fmt=(d,opt={month:'long',day:'numeric',weekday:'long'})=>new Intl.DateTimeFormat('zh-TW',opt).format(d);document.getElementById('topDate').textContent=fmt(today,{year:'numeric',month:'long',day:'numeric'});document.getElementById('todayDate').textContent=fmt(today,{month:'long',day:'numeric',weekday:'long'});document.querySelector('.eyebrow').textContent=fmt(today,{weekday:'long'}).toUpperCase()+' · YOUR DAY';

function renderAccount(user) {
  const area = document.getElementById("accountArea");
  if (user) {
    document.getElementById("authGate").hidden = true;
    document.getElementById("app").hidden = false;
    const photo = user.photoURL ? `<img src="${esc(user.photoURL)}" alt="">` : "";
    area.innerHTML = `${photo}<span>${esc(user.displayName || user.email || "已登入")}</span><button type="button" class="signout-button" id="googleSignOut">登出</button>`;
    document.getElementById("googleSignOut").onclick = async () => {
      try { await signOut(auth); }
      catch (error) { console.error(error); document.getElementById("authStatus").textContent = "登出失敗，請稍後再試。"; }
    };
    return;
  }

  document.getElementById("authGate").hidden = false;
  document.getElementById("app").hidden = true;
  document.getElementById("authStatus").textContent = "尚未登入，請使用 Google 帳號繼續。";
  area.innerHTML = `<span>尚未登入</span><button type="button" class="signin-button" id="googleSignIn">使用 Google 登入</button>`;
  const startGoogleSignIn = async () => {
    if (!firebaseReady || !auth) {
      document.getElementById("authStatus").textContent = "Firebase 設定尚未完成。";
      return;
    }
    document.getElementById("authStatus").textContent = "正在開啟 Google 登入…";
    try { await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch (error) {
      console.error(error);
      const messages = {
        "auth/popup-closed-by-user": "登入視窗已關閉。",
        "auth/unauthorized-domain": "此網站網域尚未加入 Firebase 授權網域。",
        "auth/operation-not-allowed": "Firebase 尚未啟用 Google 登入。"
      };
      document.getElementById("authStatus").textContent = messages[error.code] || "Google 登入失敗，請稍後再試。";
    }
  };
  document.getElementById("gateGoogleSignIn").onclick = startGoogleSignIn;
  document.getElementById("googleSignIn").onclick = startGoogleSignIn;
}
if (auth) {
  onAuthStateChanged(auth, renderAccount, error => {
    console.error(error);
    document.getElementById("authGate").hidden = false;
    document.getElementById("app").hidden = true;
    document.getElementById("authStatus").textContent = "無法連線至 Firebase，請重新載入頁面。";
  });
} else {
  document.getElementById("authStatus").textContent = "Firebase 設定尚未完成。";
  renderAccount(null);
}</script>
